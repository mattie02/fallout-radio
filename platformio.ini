; Vintage Radio — see CLAUDE.md for the project guide.
;
;   pio run -e esp32s3            build firmware
;   pio run -e desktop            build the macOS simulator
;   pio run -e desktop -t exec    build and run the simulator
;   pio test -e desktop           run unit tests

[platformio]
default_envs = desktop

[env]
build_flags =
    -I src
lib_deps =
    bblanchon/ArduinoJson@^7.4.1

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
build_src_filter = +<*> -<platform/desktop/>
; If the module has PSRAM (e.g. N8R8 / N16R8, octal PSRAM), uncomment this
; and add -DBOARD_HAS_PSRAM to build_flags:
; board_build.arduino.memory_type = qio_opi

[env:desktop]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++17
    -Wall
build_src_filter = +<*> -<platform/esp32/>
test_build_src = yes
; Finds SDL2 via sdl2-config, falling back to Homebrew's prefixes
; (/opt/homebrew on Apple Silicon, /usr/local on Intel). `brew install sdl2`
extra_scripts = pre:tools/build/sdl2.py
